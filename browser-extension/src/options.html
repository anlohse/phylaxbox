<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PhylaxBox</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; }
    label.check { display: flex; gap: 8px; align-items: flex-start; font-weight: normal; }
    label.check input { margin-top: 3px; }
  </style>
</head>
<body>
  <main>
    <h1 data-msg="optionsTitle"></h1>
    <label class="check">
      <input type="checkbox" id="auto-save">
      <span data-msg="autoSaveLabel"></span>
    </label>
    <p class="hint" data-msg="autoSaveHint"></p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js" type="module"></script>
</body>
</html>
