<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PhylaxBox</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f6f8; --card: #ffffff; --fg: #1d2330; --muted: #5d6675;
          --accent: #2f5bd3; --error: #b42318; --ok: #1b7f4b; --border: #d0d5dd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1d212a; --fg: #e8eaf0; --muted: #98a2b3;
            --accent: #6f93ff; --error: #f97066; --ok: #5cd394; --border: #344054; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 15px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { width: min(360px, calc(100vw - 32px)); padding: 28px; border-radius: 12px;
         background: var(--card); border: 1px solid var(--border); }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: transparent;
          border: 1px solid var(--border); border-radius: 8px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { margin-top: 14px; width: 100%; padding: 10px 12px; font: inherit; font-weight: 600;
           color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #status { min-height: 1.45em; margin: 14px 0 0; }
  #status.error { color: var(--error); }
  #status.ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>PhylaxBox</h1>
  <p class="lead">Seus dados sob o seu controle.</p>
  <form id="login-form" autocomplete="off" novalidate>
    <label for="password">Senha mestra</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
    <button type="submit" id="submit">Desbloquear</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  const form = document.getElementById('login-form');
  const input = document.getElementById('password');
  const button = document.getElementById('submit');
  const status = document.getElementById('status');

  const show = (text, kind) => {
    status.textContent = text;
    status.className = kind || '';
  };

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    // window.login is exposed by the desktop app (webview bind).
    if (typeof window.login !== 'function') {
      show('Erro interno: a comunicação com o aplicativo não está disponível.', 'error');
      return;
    }
    // Same normalization on every platform (docs/vault-format/README.md).
    const password = input.value.normalize('NFC');
    if (!password) {
      show('Digite a senha mestra.', 'error');
      input.focus();
      return;
    }
    button.disabled = true;
    show('Desbloqueando…');
    try {
      const result = await window.login(password);
      if (result && result.ok) {
        show('Cofre desbloqueado.', 'ok');
      } else {
        show((result && result.message) || 'Não foi possível desbloquear o cofre.', 'error');
      }
    } catch (error) {
      show('Erro ao comunicar com o aplicativo.', 'error');
    } finally {
      input.value = '';
      button.disabled = false;
      input.focus();
    }
  });
})();
</script>
</body>
</html>
