<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__PB_SCRIPT_HASH__'; style-src 'sha256-__PB_STYLE_HASH__'; img-src 'none'; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<title>PhylaxBox</title>
<style>
  :root { color-scheme: light; --bg: #f5f6f8; --card: #ffffff; --fg: #1d2330; --muted: #5d6675;
          --accent: #2f5bd3; --accent-fg: #ffffff; --error: #b42318; --ok: #1b7f4b; --warn-bg: #fff6e5;
          --warn-fg: #7a4b00; --border: #c4cad4; --code-bg: #eef1f6; --selected: #e7edfb; --star: #9a6700; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { color-scheme: dark; --bg: #14171d; --card: #1d212a; --fg: #e8eaf0; --muted: #a6b0bf;
            --accent: #7b9cff; --accent-fg: #0b1020; --error: #ff8a80; --ok: #5cd394; --warn-bg: #3a2c12; --warn-fg: #f3c56b;
            --border: #4a5568; --code-bg: #262b36; --selected: #26324d; --star: #f3c56b; }
  }
  :root[data-theme=dark] { color-scheme: dark; --bg: #14171d; --card: #1d212a; --fg: #e8eaf0; --muted: #a6b0bf;
          --accent: #7b9cff; --accent-fg: #0b1020; --error: #ff8a80; --ok: #5cd394; --warn-bg: #3a2c12; --warn-fg: #f3c56b;
          --border: #4a5568; --code-bg: #262b36; --selected: #26324d; --star: #f3c56b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  h3 { margin: 22px 0 8px; font-size: 15px; }
  p { margin: 0 0 14px; }
  .lead, .hint, .muted { color: var(--muted); }
  .hint { font-size: 13px; margin-top: 4px; }
  .small { font-size: 13px; }
  label { display: block; margin: 12px 0 6px; font-weight: 600; }
  label.check { display: flex; gap: 8px; align-items: center; font-weight: normal; margin: 8px 0; }
  input[type=password], input[type=text], input[type=search], input[type=number], textarea, select {
    width: 100%; padding: 9px 11px; font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; }
  input.narrow { width: 7em; }
  select.narrow { width: auto; min-width: 7em; }
  textarea { resize: vertical; min-height: 70px; }
  input:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible, li:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  button { padding: 9px 12px; font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent);
           border: 0; border-radius: 8px; cursor: pointer; }
  button.secondary { color: var(--fg); background: transparent; border: 1px solid var(--border); font-weight: normal; }
  button.danger { background: var(--error); color: #fff; }
  button.link { padding: 0; color: var(--accent); background: none; font-weight: normal; text-decoration: underline; }
  button.small { padding: 4px 9px; font-size: 13px; }
  button:disabled { opacity: .6; cursor: progress; }
  .warn { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); font-size: 14px; }
  .key, .secret { font: 600 15px/1.6 ui-monospace, Consolas, monospace; word-break: break-all; }
  .key { padding: 12px; border-radius: 8px; background: var(--code-bg); text-align: center; letter-spacing: .5px; user-select: all; }
  .path { font: 13px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; }
  .pre { white-space: pre-wrap; }
  [hidden] { display: none !important; }
  .error { color: var(--error); }
  .ok { color: var(--ok); }
  .links { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

  /* --- unlock / create / recover card --- */
  #auth { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  #auth main { width: min(420px, 100%); padding: 28px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
  #auth form button[type=submit], #auth .wide { width: 100%; margin-top: 16px; }
  #status { min-height: 1.45em; margin: 14px 0 0; }
  #backup-choices { margin: 0; padding: 0; list-style: none; max-height: 200px; overflow: auto; }

  /* --- vault --- */
  #vault { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
  #vault header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--card);
                  border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #vault header .brand { font-weight: 700; margin-right: 8px; }
  #vault header input[type=search] { max-width: 340px; flex: 1 1 200px; }
  #vault header select { width: auto; }
  #vault header .spacer { flex: 1; }
  #vault-status { min-height: 1.45em; margin: 0; padding: 4px 14px; font-size: 14px; }
  #vault .panes { display: grid; grid-template-columns: minmax(240px, 34%) 1fr; min-height: 0; }
  #entry-list { margin: 0; padding: 0; list-style: none; overflow: auto; border-right: 1px solid var(--border); }
  #entry-list li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; padding: 9px 12px; cursor: pointer;
                   border-bottom: 1px solid var(--border); }
  #entry-list li[aria-selected=true] { background: var(--selected); }
  #entry-list .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #entry-list .sub { grid-column: 2; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .star { color: var(--star); }
  #detail, #settings { overflow: auto; padding: 18px 22px; }
  #settings { grid-column: 1 / -1; max-width: 760px; }
  #detail dl { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; margin: 0 0 16px; }
  #detail dt { color: var(--muted); }
  #detail dd { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
  #detail dd .value { overflow-wrap: anywhere; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--code-bg); font-size: 13px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input:not(.narrow) { flex: 1; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0 0; padding: 8px 12px; }
  fieldset label.check { margin: 4px 16px 4px 0; display: inline-flex; }
  fieldset label { display: inline-flex; gap: 6px; align-items: center; font-weight: normal; margin: 4px 16px 4px 0; }
  #edit-form label:first-of-type { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  section.card { padding: 4px 0 12px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>

<!-- ===================== Unlock, create, recover ===================== -->
<div id="auth">
<main>
  <h1>PhylaxBox</h1>
  <p class="lead" data-i18n="tagline"></p>

  <section id="view-loading"><p data-i18n="loading"></p></section>

  <section id="view-create" hidden>
    <h2 data-i18n="create.title"></h2>
    <form id="create-form" autocomplete="off" novalidate>
      <label for="create-password" data-i18n="field.masterPassword"></label>
      <input type="password" id="create-password" autocomplete="new-password" aria-describedby="create-hint">
      <p class="hint" id="create-hint" data-i18n="create.hint"></p>
      <label for="create-confirm" data-i18n="field.confirmMasterPassword"></label>
      <input type="password" id="create-confirm" autocomplete="new-password">
      <label class="check"><input type="checkbox" id="create-recovery" checked>
        <span data-i18n="create.withRecovery"></span></label>
      <p class="warn" data-i18n="create.warning"></p>
      <button type="submit" data-i18n="create.submit"></button>
    </form>
  </section>

  <section id="view-recovery-key" hidden>
    <h2 data-i18n="recoveryKey.title"></h2>
    <p data-i18n="recoveryKey.explain"></p>
    <p class="key" id="recovery-key-text"></p>
    <label class="check"><input type="checkbox" id="recovery-saved">
      <span data-i18n="recoveryKey.saved"></span></label>
    <button type="button" class="wide" id="recovery-done" disabled data-i18n="continue"></button>
  </section>

  <section id="view-unlock" hidden>
    <h2 data-i18n="unlock.title"></h2>
    <form id="unlock-form" autocomplete="off" novalidate>
      <label for="unlock-password" data-i18n="field.masterPassword"></label>
      <input type="password" id="unlock-password" autocomplete="current-password">
      <button type="submit" data-i18n="unlock.submit"></button>
    </form>
    <p><button type="button" class="link" id="go-recover" data-i18n="unlock.forgot"></button></p>
    <p><button type="button" class="link" id="go-restore-backup" hidden data-i18n="unlock.restoreBackup"></button></p>
  </section>

  <section id="view-recover" hidden>
    <h2 data-i18n="recover.title"></h2>
    <form id="recover-form" autocomplete="off" novalidate>
      <label for="recover-key" data-i18n="field.recoveryKey"></label>
      <input type="text" id="recover-key" spellcheck="false" autocapitalize="characters" placeholder="XXXXX-XXXXX-…">
      <label for="recover-password" data-i18n="field.newMasterPassword"></label>
      <input type="password" id="recover-password" autocomplete="new-password">
      <label for="recover-confirm" data-i18n="field.confirmNewMasterPassword"></label>
      <input type="password" id="recover-confirm" autocomplete="new-password">
      <button type="submit" data-i18n="recover.submit"></button>
    </form>
    <p><button type="button" class="link" id="go-unlock" data-i18n="back"></button></p>
  </section>

  <section id="view-restore-backup" hidden>
    <h2 data-i18n="restoreBackup.title"></h2>
    <p data-i18n="restoreBackup.explain"></p>
    <form id="restore-backup-form" autocomplete="off" novalidate>
      <fieldset><legend data-i18n="restoreBackup.choose"></legend><ul id="backup-choices"></ul></fieldset>
      <label for="restore-backup-password" data-i18n="field.masterPassword"></label>
      <input type="password" id="restore-backup-password" autocomplete="current-password">
      <button type="submit" data-i18n="restoreBackup.submit"></button>
    </form>
    <p><button type="button" class="link" id="restore-backup-back" data-i18n="back"></button></p>
  </section>

  <div id="vault-location">
    <p class="hint"><span data-i18n="location.current"></span> <span class="path" id="vault-path"></span></p>
    <div class="links">
      <button type="button" class="link small" id="choose-open" data-i18n="location.open"></button>
      <button type="button" class="link small" id="choose-create" data-i18n="location.create"></button>
      <button type="button" class="link small" id="use-default" hidden data-i18n="location.default"></button>
    </div>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
</main>
</div>

<!-- ============================== Vault ============================== -->
<div id="vault" hidden>
  <header>
    <span class="brand">PhylaxBox</span>
    <input type="search" id="search" data-i18n-placeholder="vault.search" data-i18n-aria="vault.search">
    <label class="check"><input type="checkbox" id="only-favorites"><span data-i18n="vault.favorites"></span></label>
    <select id="tag-filter" data-i18n-aria="vault.tagFilter"></select>
    <span class="spacer"></span>
    <button type="button" id="new-entry" data-i18n="vault.new"></button>
    <button type="button" class="secondary" id="open-settings" data-i18n="vault.settings"></button>
    <button type="button" class="secondary" id="lock" data-i18n="vault.lock"></button>
  </header>
  <p id="vault-status" role="status" aria-live="polite"></p>

  <div class="panes" id="panes">
    <ul id="entry-list" role="listbox" data-i18n-aria="vault.items"></ul>
    <section id="detail">
      <div id="detail-empty"><p class="muted" id="detail-empty-text"></p></div>

      <div id="detail-view" hidden>
        <h2 id="d-title"></h2>
        <dl>
          <dt data-i18n="field.username"></dt>
          <dd><span class="value" id="d-username"></span>
              <button type="button" class="secondary small" id="copy-username" data-i18n="copy"></button></dd>
          <dt data-i18n="field.password"></dt>
          <dd><span class="value secret" id="d-password">••••••••</span>
              <button type="button" class="secondary small" id="toggle-password" data-i18n="show"></button>
              <button type="button" class="secondary small" id="copy-password" data-i18n="copy"></button></dd>
          <dt data-i18n="field.sites"></dt><dd><span class="value pre" id="d-urls"></span></dd>
          <dt data-i18n="field.tags"></dt><dd id="d-tags"></dd>
          <dt data-i18n="field.notes"></dt><dd><span class="value pre" id="d-notes"></span></dd>
          <dt data-i18n="field.updated"></dt><dd><span class="value muted" id="d-updated"></span></dd>
        </dl>
        <div class="actions">
          <button type="button" id="edit-entry" data-i18n="edit"></button>
          <button type="button" class="secondary" id="toggle-favorite"></button>
          <button type="button" class="secondary" id="delete-entry" data-i18n="delete"></button>
        </div>
        <div id="delete-confirm" class="warn" hidden>
          <p data-i18n="entry.deleteConfirm"></p>
          <div class="actions">
            <button type="button" class="danger" id="delete-yes" data-i18n="delete"></button>
            <button type="button" class="secondary" id="delete-no" data-i18n="cancel"></button>
          </div>
        </div>
      </div>

      <form id="edit-form" autocomplete="off" novalidate hidden>
        <h2 id="edit-heading"></h2>
        <label for="f-title" data-i18n="field.title"></label>
        <input type="text" id="f-title" maxlength="1024">
        <label for="f-username" data-i18n="field.username"></label>
        <input type="text" id="f-username" maxlength="1024" spellcheck="false">
        <label for="f-password" data-i18n="field.password"></label>
        <div class="row">
          <input type="password" id="f-password" maxlength="4096" spellcheck="false" autocomplete="new-password">
          <button type="button" class="secondary" id="f-show" data-i18n="show"></button>
          <button type="button" class="secondary" id="f-generate" data-i18n="generate"></button>
        </div>
        <fieldset>
          <legend class="muted" data-i18n="gen.title"></legend>
          <label><span data-i18n="gen.mode"></span>
            <select id="g-mode" class="narrow"><option value="password" data-i18n="gen.password"></option>
              <option value="passphrase" data-i18n="gen.passphrase"></option></select></label>
          <span id="g-password-options">
            <label><span data-i18n="gen.length"></span> <input type="number" id="g-length" class="narrow" min="8" max="128" value="20"></label>
            <label class="check"><input type="checkbox" id="g-lower" checked>a–z</label>
            <label class="check"><input type="checkbox" id="g-upper" checked>A–Z</label>
            <label class="check"><input type="checkbox" id="g-digits" checked>0–9</label>
            <label class="check"><input type="checkbox" id="g-symbols" checked>!@#</label>
            <label class="check"><input type="checkbox" id="g-ambiguous"><span data-i18n="gen.avoidAmbiguous"></span></label>
          </span>
          <span id="g-passphrase-options" hidden>
            <label><span data-i18n="gen.words"></span> <input type="number" id="g-words" class="narrow" min="4" max="20" value="6"></label>
            <label><span data-i18n="gen.separator"></span>
              <select id="g-separator" class="narrow"><option value="-">-</option><option value=" " data-i18n="gen.space"></option>
                <option value=".">.</option><option value="_">_</option></select></label>
            <label class="check"><input type="checkbox" id="g-capitalize"><span data-i18n="gen.capitalize"></span></label>
            <label class="check"><input type="checkbox" id="g-number"><span data-i18n="gen.number"></span></label>
          </span>
          <p class="hint" id="g-strength"></p>
        </fieldset>
        <label for="f-urls" data-i18n="field.sitesOnePerLine"></label>
        <textarea id="f-urls" spellcheck="false" rows="2"></textarea>
        <label for="f-tags" data-i18n="field.tagsCommas"></label>
        <input type="text" id="f-tags">
        <label for="f-notes" data-i18n="field.notes"></label>
        <textarea id="f-notes" rows="4"></textarea>
        <label class="check"><input type="checkbox" id="f-favorite"><span data-i18n="field.favorite"></span></label>
        <div class="actions">
          <button type="submit" id="save-entry" data-i18n="save"></button>
          <button type="button" class="secondary" id="cancel-edit" data-i18n="cancel"></button>
        </div>
      </form>
    </section>
  </div>

  <!-- ---------------------------- settings ---------------------------- -->
  <section id="settings" hidden>
    <div class="actions"><button type="button" class="secondary" id="close-settings" data-i18n="settings.back"></button></div>
    <h2 data-i18n="settings.title"></h2>

    <section class="card">
      <h3 data-i18n="settings.appearance"></h3>
      <label for="s-theme" data-i18n="settings.theme"></label>
      <select id="s-theme" class="narrow">
        <option value="system" data-i18n="settings.system"></option>
        <option value="light" data-i18n="settings.light"></option>
        <option value="dark" data-i18n="settings.dark"></option></select>
      <label for="s-language" data-i18n="settings.language"></label>
      <select id="s-language" class="narrow">
        <option value="system" data-i18n="settings.system"></option>
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en">English</option></select>
    </section>

    <section class="card">
      <h3 data-i18n="settings.security"></h3>
      <p class="hint" data-i18n="settings.securityHint"></p>
      <label for="s-autolock" data-i18n="settings.autoLock"></label>
      <input type="number" id="s-autolock" class="narrow" min="1" max="120">
      <label for="s-clipboard" data-i18n="settings.clipboard"></label>
      <input type="number" id="s-clipboard" class="narrow" min="10" max="300">
      <p class="warn small" data-i18n="settings.clipboardWarning"></p>
      <label class="check"><input type="checkbox" id="s-lock-session"><span data-i18n="settings.lockSession"></span></label>
      <label class="check"><input type="checkbox" id="s-lock-minimize"><span data-i18n="settings.lockMinimize"></span></label>
      <div class="actions"><button type="button" id="s-save-security" data-i18n="save"></button></div>
    </section>

    <section class="card">
      <h3 data-i18n="settings.masterPassword"></h3>
      <form id="change-password-form" autocomplete="off" novalidate>
        <label for="cp-current" data-i18n="field.currentMasterPassword"></label>
        <input type="password" id="cp-current" autocomplete="current-password">
        <label for="cp-new" data-i18n="field.newMasterPassword"></label>
        <input type="password" id="cp-new" autocomplete="new-password">
        <label for="cp-confirm" data-i18n="field.confirmNewMasterPassword"></label>
        <input type="password" id="cp-confirm" autocomplete="new-password">
        <div class="actions"><button type="submit" data-i18n="settings.changePassword"></button></div>
      </form>
    </section>

    <section class="card">
      <h3 data-i18n="settings.recoveryKey"></h3>
      <p id="rk-state"></p>
      <label for="rk-password" data-i18n="field.currentMasterPassword"></label>
      <input type="password" id="rk-password" autocomplete="current-password">
      <div class="actions">
        <button type="button" id="rk-regenerate" data-i18n="settings.newRecoveryKey"></button>
        <button type="button" class="secondary" id="rk-remove" data-i18n="settings.removeRecoveryKey"></button>
      </div>
      <div id="rk-new" hidden>
        <p data-i18n="recoveryKey.explain"></p>
        <p class="key" id="rk-new-text"></p>
        <div class="actions"><button type="button" id="rk-done" data-i18n="recoveryKey.done"></button></div>
      </div>
    </section>

    <section class="card">
      <h3 data-i18n="settings.backups"></h3>
      <p class="hint" data-i18n="settings.backupsHint"></p>
      <label for="s-retention" data-i18n="settings.retention"></label>
      <div class="row"><input type="number" id="s-retention" class="narrow" min="1" max="100">
        <button type="button" class="secondary" id="s-save-retention" data-i18n="save"></button></div>
      <label for="bk-password" data-i18n="backups.password"></label>
      <input type="password" id="bk-password" autocomplete="current-password">
      <table>
        <thead><tr><th data-i18n="backups.date"></th><th data-i18n="backups.revision"></th><th data-i18n="backups.size"></th><th></th></tr></thead>
        <tbody id="backup-rows"></tbody>
      </table>
      <p class="muted" id="backups-empty" hidden data-i18n="backups.none"></p>
    </section>

    <section class="card">
      <h3 data-i18n="settings.about"></h3>
      <p>PhylaxBox <span id="about-version"></span></p>
      <p class="small"><span data-i18n="settings.vaultFile"></span> <span class="path" id="about-path"></span></p>
      <p class="small" data-i18n="settings.credits"></p>
    </section>
  </section>
</div>

<script>
(() => {
  // ================================================================ i18n
  const I18N = {
    'pt-BR': {
      tagline: 'Seus dados sob o seu controle.', loading: 'Carregando…', continue: 'Continuar', back: 'Voltar',
      cancel: 'Cancelar', save: 'Salvar', edit: 'Editar', delete: 'Excluir', copy: 'Copiar', show: 'Mostrar', hide: 'Ocultar',
      generate: 'Gerar',
      'field.masterPassword': 'Senha mestra', 'field.confirmMasterPassword': 'Confirme a senha mestra',
      'field.currentMasterPassword': 'Senha mestra atual', 'field.newMasterPassword': 'Nova senha mestra',
      'field.confirmNewMasterPassword': 'Confirme a nova senha mestra', 'field.recoveryKey': 'Chave de recuperação',
      'field.title': 'Título', 'field.username': 'Usuário', 'field.password': 'Senha', 'field.sites': 'Sites',
      'field.tags': 'Tags', 'field.notes': 'Notas', 'field.updated': 'Atualizado', 'field.favorite': 'Favorito',
      'field.sitesOnePerLine': 'Sites (um por linha)', 'field.tagsCommas': 'Tags (separadas por vírgula)',
      'create.title': 'Criar cofre', 'create.hint': 'Pelo menos 8 caracteres. Uma frase longa é mais segura e mais fácil de lembrar.',

      'err.bridge': 'Internal error: the connection to the app is not available.', 'err.comm': 'Error talking to the app.',
    },
  };
  let lang = 'pt-BR';
  const t = (key, vars) => {
    let s = (I18N[lang] && I18N[lang][key]) ?? I18N['pt-BR'][key] ?? key;
    if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll('{' + k + '}', String(v));
    return s;
  };
  const errorText = (r) => (r && r.code && I18N[lang]['err.' + r.code]) ? t('err.' + r.code) : (r && r.message) || t('err.internal_error');
  function applyLanguage(setting) {
    lang = setting === 'pt-BR' || setting === 'en' ? setting
         : (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt-BR' : 'en';
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
    for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
  }
  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    else delete document.documentElement.dataset.theme;
  }

  // ============================================================= helpers
  const $ = (id) => document.getElementById(id);
  const AUTH_VIEWS = ['loading', 'create', 'recovery-key', 'unlock', 'recover', 'restore-backup'];
  const MIN_CHARS = 8;
  let busy = false;
  let autoLockMs = 5 * 60 * 1000;

  const show = (text, kind) => { $('status').textContent = text || ''; $('status').className = kind || ''; };
  const notify = (text, kind) => { $('vault-status').textContent = text || ''; $('vault-status').className = kind || ''; };
  const length = (s) => [...s].length; // code points, as the app counts them
  const clear = (...ids) => ids.forEach((id) => { $(id).value = ''; });

  function authView(name, focusId) {
    $('auth').hidden = false;
    $('vault').hidden = true;
    for (const v of AUTH_VIEWS) $('view-' + v).hidden = v !== name;
    $('vault-location').hidden = !['create', 'unlock'].includes(name);
    if (focusId) $(focusId).focus();
  }

  // Calls window.<name>(...args), exposed by the desktop app (webview bind).
  async function call(name, ...args) {
    if (typeof window[name] !== 'function') return { ok: false, code: 'bridge' };
    try {
      const result = (await window[name](...args)) || { ok: false, code: 'internal_error' };
      if (!result.ok && result.code === 'locked' && !$('vault').hidden) locked(t('vault.lockedRemote'));
      return result;
    } catch (error) {
      return { ok: false, code: 'comm' };
    }
  }

  // One request at a time; disables the buttons of `container` meanwhile.
  async function run(container, pendingText, task, notifyFn = show) {
    if (busy) return;
    busy = true;
    const buttons = $(container).querySelectorAll('button');
    buttons.forEach((b) => { b.disabled = true; });
    if (pendingText) notifyFn(pendingText);
    try { await task(); } finally {
      buttons.forEach((b) => { b.disabled = false; });
      busy = false;
      if (container === 'view-recovery-key') $('recovery-done').disabled = !$('recovery-saved').checked;
    }
  }

  // =========================================================== auth views
  async function refreshLocation() {
    const status = await call('vault_status');
    if (!status.ok) { show(errorText(status), 'error'); return null; }
    $('vault-path').textContent = status.vaultPath;
    $('use-default').hidden = status.isDefaultPath;
    return status;
  }

  async function start() {
    const settings = await call('settings_get');
    if (settings.ok) { applyTheme(settings.device.theme); applyLanguage(settings.device.language); }
    else applyLanguage('system');
    const status = await refreshLocation();
    if (!status) return;
    if (status.unlocked) { await openVault(); show(''); }
    else if (status.exists) { authView('unlock', 'unlock-password'); show(''); }
    else { authView('create', 'create-password'); show(''); }
  }

  $('create-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const password = $('create-password').value.normalize('NFC');
    const confirm = $('create-confirm').value.normalize('NFC');
    if (length(password) < MIN_CHARS) { show(t('password.short'), 'error'); return; }
    if (password !== confirm) { show(t('password.mismatch'), 'error'); $('create-confirm').focus(); return; }
    run('view-create', t('create.creating'), async () => {
      const result = await call('vault_create', password, $('create-recovery').checked);
      if (!result.ok) { show(errorText(result), 'error'); return; }
      clear('create-password', 'create-confirm');
      if (result.recoveryKey) {
        $('recovery-key-text').textContent = result.recoveryKey;
        $('recovery-saved').checked = false;
        authView('recovery-key', 'recovery-saved');
        show(t('create.done'), 'ok');
      } else {
        await openVault(t('create.done'));
      }
    });
  });

  $('recovery-saved').addEventListener('change', () => { $('recovery-done').disabled = !$('recovery-saved').checked; });
  $('recovery-done').addEventListener('click', async () => {
    $('recovery-key-text').textContent = ''; // do not keep it on screen
    show('');
    await openVault();
  });

  $('unlock-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const password = $('unlock-password').value.normalize('NFC');
    if (!password) { show(t('unlock.enterPassword'), 'error'); $('unlock-password').focus(); return; }
    run('view-unlock', t('unlock.working'), async () => {
      const result = await call('vault_unlock', password);
      clear('unlock-password');
      $('go-restore-backup').hidden = !(result.code === 'corrupted' || result.code === 'invalid_file');
      if (result.ok) { show(''); await openVault(); }
      else { show(errorText(result), 'error'); $('unlock-password').focus(); }
    });
  });

  $('go-recover').addEventListener('click', () => { show(''); authView('recover', 'recover-key'); });
  $('go-unlock').addEventListener('click', () => { clear('recover-key', 'recover-password', 'recover-confirm'); show(''); authView('unlock', 'unlock-password'); });

  $('recover-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const key = $('recover-key').value;
    const password = $('recover-password').value.normalize('NFC');
    const confirm = $('recover-confirm').value.normalize('NFC');
    if (!key.trim()) { show(t('recover.enterKey'), 'error'); $('recover-key').focus(); return; }
    if (length(password) < MIN_CHARS) { show(t('password.short'), 'error'); return; }
    if (password !== confirm) { show(t('password.mismatch'), 'error'); $('recover-confirm').focus(); return; }
    run('view-recover', t('recover.working'), async () => {
      const result = await call('vault_recover', key, password);
      if (result.ok) {
        clear('recover-key', 'recover-password', 'recover-confirm');
        show('');
        await openVault(t('recover.done'));
      } else {
        show(errorText(result), 'error');
      }
    });
  });

  // --- restore when the vault file is damaged ---
  $('go-restore-backup').addEventListener('click', async () => {
    const result = await call('backups_list');
    const list = $('backup-choices');
    list.replaceChildren();
    if (!result.ok) { show(errorText(result), 'error'); return; }
    if (!result.backups.length) { show(t('restoreBackup.none'), 'error'); return; }
    result.backups.forEach((b, i) => {
      const li = document.createElement('li');
      const label = document.createElement('label');
      label.className = 'check';
      const radio = document.createElement('input');
      radio.type = 'radio'; radio.name = 'backup'; radio.value = b.name; radio.checked = i === 0;
      const text = document.createElement('span');
      text.textContent = `${formatDate(b.savedAt)} · r${b.revision}`;
      label.append(radio, text);
      li.append(label);
      list.append(li);
    });
    show('');
    authView('restore-backup', 'restore-backup-password');
  });
  $('restore-backup-back').addEventListener('click', () => { clear('restore-backup-password'); show(''); authView('unlock', 'unlock-password'); });
  $('restore-backup-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const chosen = document.querySelector('input[name=backup]:checked');
    const password = $('restore-backup-password').value.normalize('NFC');
    if (!chosen) { show(t('restoreBackup.pick'), 'error'); return; }
    if (!password) { show(t('unlock.enterPassword'), 'error'); return; }
    run('view-restore-backup', t('restoreBackup.working'), async () => {
      const result = await call('vault_unlock_backup', password, chosen.value);
      clear('restore-backup-password');
      if (result.ok) { show(''); await openVault(t('backups.restored')); }
      else show(errorText(result), 'error');
    });
  });

  // --- choose another vault file ---
  async function chooseVault(mode) {
    const result = await call('vault_choose', mode, t(mode === 'open' ? 'location.dialogOpen' : 'location.dialogCreate'), t('location.filter'));
    if (!result.ok) { show(errorText(result), 'error'); return; }
    if (result.cancelled) return;
    await refreshLocation();
    $('go-restore-backup').hidden = true;
    show('');
    if (result.exists) authView('unlock', 'unlock-password');
    else authView('create', 'create-password');
  }
  $('choose-open').addEventListener('click', () => chooseVault('open'));
  $('choose-create').addEventListener('click', () => chooseVault('create'));
  $('use-default').addEventListener('click', async () => {
    const result = await call('vault_use_default');
    if (!result.ok) { show(errorText(result), 'error'); return; }
    await refreshLocation();
    $('go-restore-backup').hidden = true;
    show('');
    if (result.exists) authView('unlock', 'unlock-password'); else authView('create', 'create-password');
  });

  // ================================================================ vault
  let entries = [];          // summaries (no passwords)
  let selectedId = null;
  let current = null;        // details of the selected entry (no password)
  let editingId = null;      // null: new entry

  const formatDate = (iso) => new Date(iso).toLocaleString(lang);

  async function openVault(message) {
    $('auth').hidden = true;
    $('vault').hidden = false;
    showSettings(false);
    clear('search');
    $('only-favorites').checked = false;
    selectedId = null;
    showDetail('empty');
    const settings = await call('settings_get');
    if (settings.ok && settings.vault) autoLockMs = settings.vault.autoLockMinutes * 60 * 1000;
    await reload();
    notify(message || '', message ? 'ok' : '');
    $('search').focus();
    resetIdle();
  }

  function locked(message) {
    entries = []; current = null; selectedId = null; dirty = false;
    $('entry-list').replaceChildren();
    clearSecretFields();
    clear('cp-current', 'cp-new', 'cp-confirm', 'rk-password', 'bk-password');
    $('rk-new').hidden = true;
    $('rk-new-text').textContent = '';
    authView('unlock', 'unlock-password');
    show(message || '', message ? 'ok' : '');
  }
  // Called by the desktop app when it locks the vault itself (session lock, minimize).
  window.pbOnAutoLock = (reason) => {
    if ($('vault').hidden) return;
    locked(t(reason === 'session' ? 'vault.lockedSession' : 'vault.lockedMinimize'));
  };

  async function reload() {
    const result = await call('vault_list');
    if (!result.ok) { notify(errorText(result), 'error'); return; }
    entries = result.entries;
    refreshTagFilter();
    renderList();
  }

  const collator = () => new Intl.Collator(lang, { sensitivity: 'base', numeric: true });

  function matches(e, query) {
    if (!query) return true;
    const q = query.toLocaleLowerCase(lang);
    return [e.title, e.username, ...e.urls, ...e.tags].some((v) => v.toLocaleLowerCase(lang).includes(q));
  }

  function visibleEntries() {
    const query = $('search').value.trim();
    const onlyFav = $('only-favorites').checked;
    const tag = $('tag-filter').value;
    const c = collator();
    return entries
      .filter((e) => matches(e, query) && (!onlyFav || e.favorite) && (!tag || e.tags.includes(tag)))
      .sort((a, b) => (b.favorite - a.favorite) || c.compare(a.title, b.title));
  }

  function refreshTagFilter() {
    const select = $('tag-filter');
    const previous = select.value;
    const tags = [...new Set(entries.flatMap((e) => e.tags))].sort(collator().compare);
    select.replaceChildren(new Option(t('vault.allTags'), ''));
    for (const tag of tags) select.add(new Option(tag, tag));
    select.value = tags.includes(previous) ? previous : '';
  }

  function renderList() {
    const list = $('entry-list');
    const items = visibleEntries();
    list.replaceChildren();
    for (const e of items) {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.tabIndex = 0;
      li.dataset.id = e.id;
      li.setAttribute('aria-selected', String(e.id === selectedId));
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = e.favorite ? '★' : '';
      star.setAttribute('aria-hidden', 'true');
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = e.title;
      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = e.username || e.urls[0] || '';
      li.append(star, title, sub);
      li.setAttribute('aria-label', (e.favorite ? '★ ' : '') + e.title + (e.username ? ', ' + e.username : ''));
      li.addEventListener('click', () => select(e.id));
      li.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(e.id); }
        if (ev.key === 'ArrowDown' && li.nextElementSibling) { ev.preventDefault(); li.nextElementSibling.focus(); }
        if (ev.key === 'ArrowUp' && li.previousElementSibling) { ev.preventDefault(); li.previousElementSibling.focus(); }
      });
      list.append(li);
    }
    if (!$('edit-form').hidden) return;
    if (!entries.length) $('detail-empty-text').textContent = t('vault.empty');
    else if (!items.length) $('detail-empty-text').textContent = t('vault.noMatch');
    else $('detail-empty-text').textContent = t('vault.select');
    if (!selectedId || !items.some((e) => e.id === selectedId)) showDetail('empty');
  }

  function clearSecretFields() {
    $('d-password').textContent = '••••••••';
    $('d-password').dataset.shown = '';
    $('toggle-password').textContent = t('show');
    $('f-password').value = '';
    $('f-password').type = 'password';
    $('f-show').textContent = t('show');
  }

  function showDetail(which) {
    $('detail-empty').hidden = which !== 'empty';
    $('detail-view').hidden = which !== 'view';
    $('edit-form').hidden = which !== 'edit';
    $('delete-confirm').hidden = true;
    clearSecretFields();
  }

  async function select(id) {
    if (!$('edit-form').hidden && !confirmDiscard()) return;
    const result = await call('vault_get', id);
    if (!result.ok) { notify(errorText(result), 'error'); await reload(); return; }
    selectedId = id;
    current = result.entry;
    for (const li of $('entry-list').children) li.setAttribute('aria-selected', String(li.dataset.id === id));
    $('d-title').textContent = current.title;
    $('d-username').textContent = current.username || '—';
    $('copy-username').hidden = !current.username;
    $('copy-password').hidden = !current.hasPassword;
    $('toggle-password').hidden = !current.hasPassword;
    $('d-urls').textContent = current.urls.join('\n') || '—';
    const tags = $('d-tags');
    tags.replaceChildren();
    for (const tag of current.tags) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = tag; tags.append(s); }
    if (!current.tags.length) tags.textContent = '—';
    $('d-notes').textContent = current.notes || '—';
    $('d-updated').textContent = formatDate(current.updatedAt);
    $('toggle-favorite').textContent = t(current.favorite ? 'entry.unfavorite' : 'entry.favorite');
    showDetail('view');
    if (!current.hasPassword) $('d-password').textContent = '—';
  }

  $('toggle-password').addEventListener('click', async () => {
    const el = $('d-password');
    if (el.dataset.shown) { clearSecretFields(); return; }
    const result = await call('vault_reveal', selectedId);
    if (!result.ok) { notify(errorText(result), 'error'); return; }
    el.textContent = result.password;
    el.dataset.shown = '1';
    $('toggle-password').textContent = t('hide');
  });

  async function copyField(field, messageKey) {
    const result = await call('vault_copy', selectedId, field);
    if (result.ok) notify(t(messageKey, { s: result.clearsIn }), 'ok');
    else notify(errorText(result), 'error');
  }
  $('copy-username').addEventListener('click', () => copyField('username', 'entry.copiedUsername'));
  $('copy-password').addEventListener('click', () => copyField('password', 'entry.copiedPassword'));

  $('toggle-favorite').addEventListener('click', () => {
    run('detail', null, async () => {
      const result = await call('vault_favorite', selectedId, !current.favorite);
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      await reload();
      await select(selectedId);
    }, notify);
  });

  $('delete-entry').addEventListener('click', () => { $('delete-confirm').hidden = false; $('delete-no').focus(); });
  $('delete-no').addEventListener('click', () => { $('delete-confirm').hidden = true; $('delete-entry').focus(); });
  $('delete-yes').addEventListener('click', () => {
    run('detail', t('entry.deleting'), async () => {
      const result = await call('vault_delete', selectedId);
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      selectedId = null;
      showDetail('empty');
      await reload();
      notify(t('entry.deleted'), 'ok');
    }, notify);
  });

  // =============================================================== editor
  let dirty = false;
  $('edit-form').addEventListener('input', () => { dirty = true; });
  const confirmDiscard = () => !dirty || window.confirm(t('entry.discard'));

  async function openEditor(id) {
    editingId = id;
    showDetail('edit');
    $('edit-heading').textContent = t(id ? 'entry.edit' : 'entry.new');
    if (id) {
      const reveal = current.hasPassword ? await call('vault_reveal', id) : { ok: true, password: '' };
      if (!reveal.ok) { notify(errorText(reveal), 'error'); showDetail('view'); return; }
      $('f-title').value = current.title;
      $('f-username').value = current.username;
      $('f-password').value = reveal.password;
      $('f-urls').value = current.urls.join('\n');
      $('f-tags').value = current.tags.join(', ');
      $('f-notes').value = current.notes;
      $('f-favorite').checked = current.favorite;
    } else {
      clear('f-title', 'f-username', 'f-password', 'f-urls', 'f-tags', 'f-notes');
      $('f-favorite').checked = false;
      for (const li of $('entry-list').children) li.setAttribute('aria-selected', 'false');
    }
    $('g-strength').textContent = '';
    dirty = false;
    $('f-title').focus();
  }

  $('new-entry').addEventListener('click', () => {
    if (!$('settings').hidden) showSettings(false);
    if (!$('edit-form').hidden && !confirmDiscard()) return;
    openEditor(null);
  });
  $('edit-entry').addEventListener('click', () => openEditor(selectedId));
  $('cancel-edit').addEventListener('click', async () => {
    if (!confirmDiscard()) return;
    dirty = false;
    if (editingId) await select(editingId); else showDetail('empty');
  });

  $('f-show').addEventListener('click', () => {
    const input = $('f-password');
    input.type = input.type === 'password' ? 'text' : 'password';
    $('f-show').textContent = t(input.type === 'password' ? 'show' : 'hide');
  });

  $('g-mode').addEventListener('change', () => {
    const passphrase = $('g-mode').value === 'passphrase';
    $('g-password-options').hidden = passphrase;
    $('g-passphrase-options').hidden = !passphrase;
    $('g-strength').textContent = '';
  });

  $('f-generate').addEventListener('click', async () => {
    let result;
    if ($('g-mode').value === 'passphrase') {
      result = await call('passphrase_generate', {
        words: Math.max(4, Math.min(20, parseInt($('g-words').value, 10) || 6)),
        separator: $('g-separator').value, capitalize: $('g-capitalize').checked, includeNumber: $('g-number').checked,
      });
    } else {
      result = await call('password_generate', {
        length: Math.max(8, Math.min(128, parseInt($('g-length').value, 10) || 20)),
        lowercase: $('g-lower').checked, uppercase: $('g-upper').checked,
        digits: $('g-digits').checked, symbols: $('g-symbols').checked,
        avoidAmbiguous: $('g-ambiguous').checked,
      });
    }
    if (!result.ok) { notify(errorText(result), 'error'); return; }
    $('f-password').value = result.password;
    $('f-password').type = 'text';
    $('f-show').textContent = t('hide');
    $('g-strength').textContent = result.bits ? t('gen.strength', { b: Math.floor(result.bits) }) : '';
    dirty = true;
  });

  $('edit-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const fields = {
      title: $('f-title').value.trim(),
      username: $('f-username').value,
      password: $('f-password').value,
      urls: $('f-urls').value.split('\n').map((s) => s.trim()).filter(Boolean),
      tags: $('f-tags').value.split(',').map((s) => s.trim()).filter(Boolean),
      notes: $('f-notes').value,
      favorite: $('f-favorite').checked,
    };
    if (!fields.title) { notify(t('err.title_required'), 'error'); $('f-title').focus(); return; }
    run('edit-form', t('entry.saving'), async () => {
      const result = editingId ? await call('vault_update', editingId, fields) : await call('vault_add', fields);
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      dirty = false;
      const id = editingId || result.id;
      await reload();
      await select(id);
      notify(t('entry.saved'), 'ok');
    }, notify);
  });

  // ============================================================= settings
  function showSettings(visible) {
    $('settings').hidden = !visible;
    $('panes').hidden = visible;
    for (const id of ['search', 'only-favorites', 'tag-filter']) $(id).disabled = visible;
  }

  async function openSettings() {
    if (!$('edit-form').hidden && !confirmDiscard()) return;
    dirty = false;
    const [settings, status, info] = await Promise.all([call('settings_get'), call('vault_status'), call('app_info')]);
    if (!settings.ok || !status.ok) { notify(errorText(settings.ok ? status : settings), 'error'); return; }
    $('s-theme').value = settings.device.theme;
    $('s-language').value = settings.device.language;
    $('s-retention').value = settings.device.backupRetention;
    $('s-autolock').value = settings.vault.autoLockMinutes;
    $('s-clipboard').value = settings.vault.clipboardClearSeconds;
    $('s-lock-session').checked = settings.vault.lockOnSessionLock;
    $('s-lock-minimize').checked = settings.vault.lockOnMinimize;
    $('rk-state').textContent = t(status.hasRecoveryKey ? 'settings.hasRecoveryKey' : 'settings.noRecoveryKey');
    $('rk-remove').hidden = !status.hasRecoveryKey;
    $('about-version').textContent = info.ok ? info.version : '';
    $('about-path').textContent = status.vaultPath;
    await loadBackups();
    showSettings(true);
    notify('');
    $('close-settings').focus();
  }
  $('open-settings').addEventListener('click', openSettings);
  $('close-settings').addEventListener('click', () => { showSettings(false); $('search').focus(); });

  async function saveDevice(changes) {
    const result = await call('settings_set_device', changes);
    if (!result.ok) { notify(errorText(result), 'error'); return false; }
    notify(t('settings.saved'), 'ok');
    return true;
  }
  $('s-theme').addEventListener('change', async () => { if (await saveDevice({ theme: $('s-theme').value })) applyTheme($('s-theme').value); });
  $('s-language').addEventListener('change', async () => {
    if (await saveDevice({ language: $('s-language').value })) {
      applyLanguage($('s-language').value);
      await openSettings(); // re-render dynamic texts in the new language
      refreshTagFilter(); renderList();
      notify(t('settings.saved'), 'ok');
    }
  });
  $('s-save-retention').addEventListener('click', async () => {
    if (await saveDevice({ backupRetention: parseInt($('s-retention').value, 10) || 0 })) await loadBackups();
  });

  $('s-save-security').addEventListener('click', () => {
    run('settings', null, async () => {
      const result = await call('settings_set_vault', {
        autoLockMinutes: parseInt($('s-autolock').value, 10) || 0,
        clipboardClearSeconds: parseInt($('s-clipboard').value, 10) || 0,
        lockOnSessionLock: $('s-lock-session').checked,
        lockOnMinimize: $('s-lock-minimize').checked,
      });
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      autoLockMs = (parseInt($('s-autolock').value, 10) || 5) * 60 * 1000;
      notify(t('settings.saved'), 'ok');
    }, notify);
  });

  $('change-password-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const current = $('cp-current').value.normalize('NFC');
    const next = $('cp-new').value.normalize('NFC');
    const confirm = $('cp-confirm').value.normalize('NFC');
    if (!current) { notify(t('settings.passwordRequired'), 'error'); $('cp-current').focus(); return; }
    if (length(next) < MIN_CHARS) { notify(t('password.short'), 'error'); return; }
    if (next !== confirm) { notify(t('password.mismatch'), 'error'); $('cp-confirm').focus(); return; }
    run('settings', t('entry.saving'), async () => {
      const result = await call('password_change', current, next);
      clear('cp-current');
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      clear('cp-new', 'cp-confirm');
      await loadBackups();
      notify(t('settings.passwordChanged'), 'ok');
    }, notify);
  });

  $('rk-regenerate').addEventListener('click', () => {
    const password = $('rk-password').value.normalize('NFC');
    if (!password) { notify(t('settings.passwordRequired'), 'error'); $('rk-password').focus(); return; }
    run('settings', t('entry.saving'), async () => {
      const result = await call('recovery_regenerate', password);
      clear('rk-password');
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      $('rk-new-text').textContent = result.recoveryKey;
      $('rk-new').hidden = false;
      $('rk-state').textContent = t('settings.hasRecoveryKey');
      $('rk-remove').hidden = false;
      await loadBackups();
      notify('');
      $('rk-done').focus();
    }, notify);
  });
  $('rk-done').addEventListener('click', () => { $('rk-new-text').textContent = ''; $('rk-new').hidden = true; });
  $('rk-remove').addEventListener('click', () => {
    const password = $('rk-password').value.normalize('NFC');
    if (!password) { notify(t('settings.passwordRequired'), 'error'); $('rk-password').focus(); return; }
    if (!window.confirm(t('settings.removeRecoveryConfirm'))) return;
    run('settings', t('entry.saving'), async () => {
      const result = await call('recovery_remove', password);
      clear('rk-password');
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      $('rk-state').textContent = t('settings.noRecoveryKey');
      $('rk-remove').hidden = true;
      await loadBackups();
      notify(t('settings.recoveryRemoved'), 'ok');
    }, notify);
  });

  const formatSize = (n) => n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;
  async function loadBackups() {
    const result = await call('backups_list');
    const rows = $('backup-rows');
    rows.replaceChildren();
    if (!result.ok) { notify(errorText(result), 'error'); return; }
    $('backups-empty').hidden = result.backups.length > 0;
    for (const b of result.backups) {
      const tr = document.createElement('tr');
      for (const text of [formatDate(b.savedAt), 'r' + b.revision, formatSize(b.size)]) {
        const td = document.createElement('td'); td.textContent = text; tr.append(td);
      }
      const td = document.createElement('td');
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'secondary small'; button.textContent = t('backups.restore');
      button.setAttribute('aria-label', `${t('backups.restore')} ${formatDate(b.savedAt)}`);
      button.addEventListener('click', () => restoreBackup(b.name));
      td.append(button); tr.append(td); rows.append(tr);
    }
  }
  function restoreBackup(name) {
    const password = $('bk-password').value.normalize('NFC');
    if (!password) { notify(t('settings.passwordRequired'), 'error'); $('bk-password').focus(); return; }
    if (!window.confirm(t('backups.restoreConfirm'))) return;
    run('settings', t('restoreBackup.working'), async () => {
      const result = await call('backup_restore', password, name);
      clear('bk-password');
      if (!result.ok) { notify(errorText(result), 'error'); return; }
      await loadBackups();
      await reload();
      notify(t('backups.restored'), 'ok');
    }, notify);
  }

  // ===================================================== search, filters
  $('search').addEventListener('input', renderList);
  $('only-favorites').addEventListener('change', renderList);
  $('tag-filter').addEventListener('change', renderList);
  document.addEventListener('keydown', (ev) => {
    if ($('vault').hidden) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'f' && $('settings').hidden) { ev.preventDefault(); $('search').focus(); }
    if (ev.key === 'Escape' && document.activeElement === $('search')) { clear('search'); renderList(); }
  });

  // ================================================================= lock
  async function lockNow(message) {
    if ($('vault').hidden) return;
    dirty = false;
    const result = await call('vault_lock');
    if (result.ok) locked(message);
    else notify(errorText(result), 'error');
  }
  $('lock').addEventListener('click', () => lockNow(t('vault.locked')));

  // Auto-lock after the configured time without interaction (spec §7.5).
  let lastActivity = Date.now();
  const resetIdle = () => { lastActivity = Date.now(); };
  for (const type of ['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart']) {
    document.addEventListener(type, resetIdle, { passive: true });
  }
  setInterval(() => {
    if (!$('vault').hidden && Date.now() - lastActivity >= autoLockMs) lockNow(t('vault.lockedIdle'));
  }, 5000);

  applyLanguage('system');
  start();
})();
</script>
</body>
</html>
